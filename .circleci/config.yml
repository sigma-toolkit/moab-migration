# CircleCI configuration file
version: 2.1

orbs:
  docker: circleci/docker@2.1.2
  codecov: codecov/codecov@3.0.0

jobs:
  build:
    working_directory: ~/fathomteam/moab
    parallelism: 1
    shell: /bin/bash --login
    # To see the list of pre-built images that CircleCI provides for most common languages see
    # https://circleci.com/docs/2.0/circleci-images/
    docker:
    - image: cimg/base:2021.07
    steps:
    # Machine Setup
    #   If you break your build into multiple jobs with workflows, you will probably want to do the parts of this that are relevant in each
    # The following `checkout` command checks out your code to your working directory. 
    - checkout
    # Dependencies
    #   This would typically go in either a build or a build-and-test job when using workflows
    # Run the setup and install any pre-dependencies for building MOAB 
    - run: |
        sudo apt -yy update
        sudo apt -yy install libhdf5-mpi-dev libnetcdf-mpi-dev libmetis-dev libopenblas-dev libeigen3-dev
        autoreconf -fi
    # Run the actual configuration command
    - run: |
        ./configure --with-eigen3=/usr/include/eigen3 --with-hdf5=/usr/lib/x86_64-linux-gnu/hdf5/openmpi --with-netcdf=/usr/lib/x86_64-linux-gnu/netcdf/mpi --with-metis=/usr LDFLAGS="-L/usr/lib/x86_64-linux-gnu/hdf5/openmpi/ -L/usr/lib/x86_64-linux-gnu/openblas-serial" --with-mpi=/usr/lib/x86_64-linux-gnu/openmpi CC=mpicc CXX=mpicxx FC=mpif90 F77=mpif77
        make all -j4
        make check -j4
  coverage-job:
    working_directory: ~/fathomteam/moab
    parallelism: 1
    shell: /bin/bash --login
    # To see the list of pre-built images that CircleCI provides for most common languages see
    # https://circleci.com/docs/2.0/circleci-images/
    docker:
    - image: cimg/base:2021.07
    steps:
    # Machine Setup
    #   If you break your build into multiple jobs with workflows, you will probably want to do the parts of this that are relevant in each
    # The following `checkout` command checks out your code to your working directory. 
    - checkout
    # Dependencies
    #   This would typically go in either a build or a build-and-test job when using workflows
    # Run the setup and install any pre-dependencies for building MOAB 
    - run: |
        sudo apt -yy update
        sudo apt -yy install libhdf5-mpi-dev libnetcdf-mpi-dev libpnetcdf-dev libmetis-dev libopenblas-dev libeigen3-dev
        autoreconf -fi
    # Run the actual configuration command
    - run: |
        ./configure --enable-debug --disable-optimize --with-eigen3=/usr/include/eigen3 --download-tempestremap=master --with-pnetcdf=/usr --with-hdf5=/usr/lib/x86_64-linux-gnu/hdf5/openmpi --with-netcdf=/usr/lib/x86_64-linux-gnu/netcdf/mpi --with-metis=/usr LDFLAGS="-L/usr/lib/x86_64-linux-gnu/hdf5/openmpi/ -L/usr/lib/x86_64-linux-gnu/openblas-serial" --with-mpi=/usr/lib/x86_64-linux-gnu/openmpi CC=mpicc CXX=mpicxx FC=mpif90 F77=mpif77 CFLAGS="-O0 -fprofile-arcs -ftest-coverage" FCFLAGS="-O0 -fprofile-arcs -ftest-coverage" FFLAGS="-O0 -fprofile-arcs -ftest-coverage" CXXFLAGS="-O0 -fprofile-arcs -ftest-coverage" LDFLAGS="-lgcov" LIBS="--coverage" FLIBS="--coverage"
        make all -j4
        make check -j4 -k
        lcov -c -d . -o coverage.info --no-external
        lcov -r coverage.info "`pwd`/test/*.*" -o coverage_sk.info
        curl -fLso codecov https://codecov.io/bash
        chmod +x codecov
        ./codecov -t CODECOV_TOKEN
  dockerbuild:
    docker:
      # replace with your preferred image
      - image: cimg/base:2021.07
    steps:
      - docker/build:
          image: vijaysm/moab-root
          path: docker/TempestRemap
          tag: moabtr
  

workflows:
  version: 2.1
  build_and_test:
    jobs:
      - build
  coverage_build:
    jobs:
      - coverage-job
  docker_build:
    jobs:
      # - dockerbuild
      - docker/publish:
          image: vijaysm/moab-root
          docker-username: DOCKER_LOGIN
          docker-password: DOCKER_PASSWORD
          deploy: true
          lint-dockerfile: false
          remote-docker-dlc: false
          treat-warnings-as-errors: false
          update-description: false
          use-docker-credentials-store: false
          use-remote-docker: false
          tag: moabtr
          path: docker/TempestRemap
          filters:
            branches:
              only:
                - release/*
