# CONFIG_DESC: ATM-OCN two-hop coupling — BfB digest across rank counts
TEST_NAME=imoab_coupler_twohop
TEST_MODE=bfb

: "${MOAB_BUILD:=/nfs/gce/projects/sigma/vijaysm/moab/build/e3sm-gnu}"
: "${MOAB_MESH_DIR:=/nfs/gce/projects/sigma/vijaysm/moab/MeshFiles}"

EXE="$MOAB_BUILD/test/earthsystem/parallel/imoab_coupler_twohop"

SRC_FLAG="-t"
TGT_FLAG="-m"
DEFAULT_SRC="$MOAB_MESH_DIR/unittest/wholeATM_T.h5m"
DEFAULT_TGT="$MOAB_MESH_DIR/unittest/recMeshOcn.h5m"

ONLINE_FLAGS="--no_regression"
LOAD_FLAGS="--no_regression"
DIGEST_FLAG="--digest_prefix imoab_coupler_twohop_digest"
DIGEST_PREFIX="imoab_coupler_twohop_digest"
DIGEST_KERNELS="ocn ocn2"
DIGEST_TOLERANCE=1e-9

DEFAULT_RANKS="1 2 4"
