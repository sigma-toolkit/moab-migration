# CONFIG_DESC: coupler BFB — ATM-OCN weights loaded from pre-computed file (near-BfB)
TEST_NAME=imoab_coupler_bfb
TEST_MODE=bfb

# LoadMapFile builds the sparse-matrix column index from a sorted set of
# global DOFs, which may differ from the entity-traversal order used by the
# online ComputeScalarProjectionWeights path.  The weight values are
# identical, but the different local column numbering changes the FP
# accumulation order in deterministicSparseMatVecMulClean, producing
# last-digit (16th significant digit) rounding differences on ~0.2% of
# target cells.  A relative tolerance of 1e-14 captures this without
# masking real regressions.
DIGEST_TOLERANCE=1e-14

: "${MOAB_BUILD:=/nfs/gce/projects/sigma/vijaysm/moab/build/e3sm-gnu}"
: "${MOAB_MESH_DIR:=/nfs/gce/projects/sigma/vijaysm/moab/MeshFiles}"

EXE="$MOAB_BUILD/test/earthsystem/parallel/imoab_coupler"

SRC_FLAG="-t"
TGT_FLAG="-m"
DEFAULT_SRC="$MOAB_MESH_DIR/unittest/wholeATM_T.h5m"
DEFAULT_TGT="$MOAB_MESH_DIR/unittest/recMeshOcn.h5m"

# The coupler needs a LND mesh via -l.
EXTRA_ARGS="-l $MOAB_MESH_DIR/unittest/wholeLnd.h5m"

# The coupler does ATM-OCN (map-based) and ATM-LND (point-cloud). We only
# verify BfB on the OCN path; LND writes are tolerance-checked separately.
# Phase A: serial compute online + write maps  →  <prefix>_atm_ocn.nc
ONLINE_FLAGS="--write_maps ${TEST_NAME}_baseline --no_regression"

# Phase B/C: reload the serial-computed map  →  BfB digest across ranks
LOAD_FLAGS="--ocn_map_file ${TEST_NAME}_baseline_atm_ocn.nc --no_regression"

DIGEST_FLAG="--digest_prefix ${TEST_NAME}_digest"
DIGEST_PREFIX="${TEST_NAME}_digest"
# Single kernel "ocn" = gather_and_write_proj_tag writes <prefix>_ocn.txt
DIGEST_KERNELS="ocn"

DEFAULT_RANKS="1 2 4"
