# CONFIG_DESC: ATM-OCN bilinear coupling — BfB digest across rank counts
TEST_NAME=imoab_coupler_bilin
TEST_MODE=bfb

: "${MOAB_BUILD:=/nfs/gce/projects/sigma/vijaysm/moab/build/e3sm-gnu}"
: "${MOAB_MESH_DIR:=/nfs/gce/projects/sigma/vijaysm/moab/MeshFiles}"

EXE="$MOAB_BUILD/test/parallel/imoab_coupler_bilin"

SRC_FLAG="-t"
TGT_FLAG="-m"
DEFAULT_SRC="$MOAB_MESH_DIR/unittest/atm_c2x.h5m"
DEFAULT_TGT="$MOAB_MESH_DIR/unittest/wholeOcn.h5m"

ONLINE_FLAGS="--no_regression"
LOAD_FLAGS="--no_regression"
DIGEST_FLAG="--digest_prefix imoab_coupler_bilin_digest"
DIGEST_PREFIX="imoab_coupler_bilin_digest"
DIGEST_KERNELS="ocn"
DIGEST_TOLERANCE=1e-9

DEFAULT_RANKS="1 2 4"
