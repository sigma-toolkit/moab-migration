# CONFIG_DESC: SpMV BfB across rank counts (lo+hi+dual projections)
TEST_NAME=imoab_spmv_bfb
TEST_MODE=bfb

: "${MOAB_BUILD:=/nfs/gce/projects/sigma/vijaysm/moab/build/e3sm-gnu}"
: "${MOAB_MESH_DIR:=/nfs/gce/projects/sigma/vijaysm/moab/MeshFiles}"

EXE="$MOAB_BUILD/test/parallel/imoab_spmv_bfb"

SRC_FLAG="-t"
TGT_FLAG="-m"
DEFAULT_SRC="$MOAB_MESH_DIR/unittest/srcWithSolnTag.h5m"
DEFAULT_TGT="$MOAB_MESH_DIR/unittest/outTri15_8.h5m"

# Per-test namespacing: every persistent artifact is prefixed with $TEST_NAME
# so concurrent harness runs (or a shared $WORKDIR) cannot collide between
# different configs.
# imoab_spmv_bfb computes maps online by default (no opt-in flag); -l/-h
# switch to load-from-disk. -w <prefix> writes the active maps after compute.
ONLINE_FLAGS="-w ${TEST_NAME}_baseline"
LOAD_FLAGS="-l ${TEST_NAME}_baseline_lo.nc -h ${TEST_NAME}_baseline_hi.nc"

DIGEST_FLAG="-o ${TEST_NAME}_digest"
DIGEST_PREFIX="${TEST_NAME}_digest"
DIGEST_KERNELS="lo hi dual"

DEFAULT_RANKS="1 2 4"
