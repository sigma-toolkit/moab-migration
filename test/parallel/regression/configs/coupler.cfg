# CONFIG_DESC: imoab_coupler -- atm/ocn online weights, parallel vs serial tolerance
TEST_NAME=imoab_coupler
TEST_MODE=tol

: "${MOAB_BUILD:=/nfs/gce/projects/sigma/vijaysm/moab/build/e3sm-gnu}"
: "${MOAB_MESH_DIR:=/nfs/gce/projects/sigma/vijaysm/moab/MeshFiles}"

EXE="$MOAB_BUILD/test/parallel/imoab_coupler"

SRC_FLAG="-t"
TGT_FLAG="-m"
DEFAULT_SRC="$MOAB_MESH_DIR/unittest/wholeATM_T.h5m"
DEFAULT_TGT="$MOAB_MESH_DIR/unittest/recMeshOcn.h5m"

H5M_ARTIFACTS="fOcnOnCpl.h5m OcnWithProj.h5m LndWithProj.h5m recvLnd3.h5m"

# The coupler needs a LND mesh via -l.
EXTRA_ARGS="-l $MOAB_MESH_DIR/unittest/wholeLnd.h5m --no_regression"

DEFAULT_RANKS="1 2 4"
TOLERANCE=1e-9
